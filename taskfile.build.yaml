          {{.ODIN_COMPILE_RELEASE_FLAGS}} {{.ODIN_COMPILE_MACOS_FLAGS}}
          {{.ODIN_COMPILE_MACOS_X64_FLAGS}}
          -out:{{.ROOT_DIR}}/dist/release/macos/x64/{{.APP_NAME}}{{exeExt}}'
  build:release:macos:arm64:
    desc: 'Build the application in release mode for macOS ARM64.'
