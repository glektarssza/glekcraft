      - cmd:
          '{{.ODIN_COMPILER}} build {{.ROOT_DIR}}/app/ {{.ODIN_COMPILE_FLAGS}}
          {{.ODIN_COMPILE_DEBUG_FLAGS}} {{.ODIN_COMPILE_WINDOWS_FLAGS}}
          {{.ODIN_COMPILE_WINDOWS_X64_FLAGS}}
          -out:{{.ROOT_DIR}}/dist/debug/windows/x64/{{.APP_NAME}}{{exeExt}}'
  build:debug:windows:x86:
    desc: 'Build the application in debug mode for Windows x86.'
    if: |
