          {{.ODIN_COMPILE_RELEASE_FLAGS}} {{.ODIN_COMPILE_MACOS_FLAGS}}
          {{.ODIN_COMPILE_MACOS_ARM64_FLAGS}}
          -out:{{.ROOT_DIR}}/dist/release/macos/arm64/{{.APP_NAME}}{{exeExt}}'
  build:debug:windows:
    desc: 'Build the application in debug mode for Windows.'
    deps:
      - 'build:debug:windows:x64'
      - 'build:debug:windows:x86'
  build:debug:linux:
    desc: 'Build the application in debug mode for Linux.'
    deps:
      - 'build:debug:linux:x64'
      - 'build:debug:linux:arm64'
      - 'build:debug:linux:x86'
  build:debug:macos:
    desc: 'Build the application in debug mode for macOS.'
