          {{.ODIN_COMPILE_RELEASE_FLAGS}} {{.ODIN_COMPILE_LINUX_FLAGS}}
          {{.ODIN_COMPILE_LINUX_X86_FLAGS}}
          -out:{{.ROOT_DIR}}/dist/release/linux/x86/{{.APP_NAME}}{{exeExt}}'
  build:release:macos:x64:
    desc: 'Build the application in release mode for macOS x64.'
