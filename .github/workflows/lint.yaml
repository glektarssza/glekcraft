# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Lint
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.ref || github.sha || github.event.repository.default_branch}}
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to clone the repository
      contents: read
    steps:
      - id: clone-repository
        name: Clone the repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: prepare-llvm
        name: Prepare LLVM
        run: |
          # Install latest mainline LLVM release
          sudo bash -c "$(curl -LSso - https://apt.llvm.org/llvm.sh)" -- 22 all
          # Set up various clang/LLVM binaries to be able to be found/swapped between for various versions we might install.
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/lib/llvm-22/bin/clang-format 1000
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/lib/llvm-22/bin/clang-tidy 1000
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-22/bin/clang 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-22/bin/clang++ 1000
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/lib/llvm-22/bin/clangd 1000
          sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/lib/llvm-22/bin/lld-link 1000
          sudo update-alternatives --install /usr/bin/lldb lldb /usr/lib/llvm-22/bin/lldb 1000
          sudo update-alternatives --install /usr/bin/lldb-server lldb-server /usr/lib/llvm-22/bin/lldb-server 1000
      - id: prepare-python
        name: Prepare Python
        uses: actions/setup-python@v6
        with:
          python-version: '>=3'
      - id: install-pre-commit
        name: Install pre-commit
        run: ./scripts/install-pre-commit.sh --force
      - id: lint
        name: Lint
        run: |
          pre-commit run --all-files
