# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.ref || github.sha || github.event.repository.default_branch}}
      build-config:
        description: |
          The configuration to build for.

          Valid options are:
          * 'debug'
          * 'release'
        type: string
        required: true
      build-os:
        description: |
          The operating system to build for.

          Valid options are:
          * 'windows'
          * 'linux'
          * 'osx'
        type: string
        required: true
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  map-build-config:
    name: Map Build Config
    permissions:
      # -- To clone repository
      contents: read
    uses: ./.github/workflows/map-build-config.yaml
    with:
      git-ref: ${{inputs.git-ref}}
      build-config: ${{inputs.build-config}}
    secrets:
      github-token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
  map-build-os:
    name: Map Build OS
    permissions:
      # -- To clone repository
      contents: read
    uses: ./.github/workflows/map-os.yaml
    with:
      git-ref: ${{inputs.git-ref}}
      os: ${{inputs.build-os}}
    secrets:
      github-token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
  build:
    name: Build
    needs:
      - map-build-config
      - map-build-os
    runs-on: ${{needs.map-build-os.outputs.mapped-os}}
    permissions:
      # -- Needed to clone the repository
      contents: read
    steps:
      - id: clone-repository
        name: Clone the repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: prepare-llvm
        name: Prepare LLVM
        run: |
          # Install latest mainline LLVM release
          sudo bash -c "$(curl -LSso - https://apt.llvm.org/llvm.sh)" -- 22 all
          # Set up various clang/LLVM binaries to be able to be found/swapped between for various versions we might install.
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/lib/llvm-22/bin/clang-format 1000
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/lib/llvm-22/bin/clang-tidy 1000
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-22/bin/clang 1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-22/bin/clang++ 1000
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/lib/llvm-22/bin/clangd 1000
          sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/lib/llvm-22/bin/lld-link 1000
          sudo update-alternatives --install /usr/bin/lldb lldb /usr/lib/llvm-22/bin/lldb 1000
          sudo update-alternatives --install /usr/bin/lldb-server lldb-server /usr/lib/llvm-22/bin/lldb-server 1000
      - id: prepare-cmake
        name: Prepare CMake
        run: |
          curl -LSso ${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-x86_64.tar.gz
          sudo mkdir -p /opt/cmake/
          sudo tar --strip-components=1 --directory=/opt/cmake/ --auto-compress --extract --file=${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz
          rm -rf ${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz
          sudo update-alternatives --install /usr/bin/cmake cmake /opt/cmake/bin/cmake 1000
          sudo update-alternatives --install /usr/bin/ctest ctest /opt/cmake/bin/ctest 1000
          sudo update-alternatives --install /usr/bin/cpack cpack /opt/cmake/bin/cpack 1000
          sudo update-alternatives --install /usr/bin/ccmake ccmake /opt/cmake/bin/ccmake 1000
          sudo update-alternatives --install /usr/bin/cmake-gui cmake-gui /opt/cmake/bin/cmake-gui 1000
      - id: run-cmake
        name: Run CMake
        run: |
          echo "::debug::Using \"$(command -v cmake)\" for \"cmake\" binary"
          cmake -S ${{github.workspace}} --workflow ${{needs.map-build-config.outputs.mapped-build-config}}-ninja-clang
      - id: upload-artifacts
        name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/${{needs.map-build-config.outputs.mapped-build-config}}-ninja-clang/dist/glekcraft-*.zip
          archive: false
          if-no-files-found: error
