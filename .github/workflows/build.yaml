# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.ref || github.sha || github.event.repository.default_branch}}
      build-config:
        description: |
          The configuration to build for.

          Valid options are:
          * 'debug'
          * 'release'
        type: string
        required: true
      build-os:
        description: |
          The operating system to build for.

          Valid options are:
          * 'windows'
          * 'linux'
          * 'osx'
        type: string
        required: true
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  map-build-config:
    name: Map Build Config
    permissions:
      # -- To clone repository
      contents: read
    uses: ./.github/workflows/map-build-config.yaml
    with:
      git-ref: ${{inputs.git-ref}}
      build-config: ${{inputs.build-config}}
    secrets:
      github-token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
  map-build-os:
    name: Map Build OS
    permissions:
      # -- To clone repository
      contents: read
    uses: ./.github/workflows/map-os.yaml
    with:
      git-ref: ${{inputs.git-ref}}
      os: ${{inputs.build-os}}
    secrets:
      github-token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
  build:
    name: Build
    needs:
      - map-build-config
      - map-build-os
    runs-on: ${{needs.map-build-os.outputs.mapped-os}}
    permissions:
      # -- Needed to clone the repository
      contents: read
    steps:
      - id: clone-repository
        name: Clone the repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: prepare-llvm-linux
        name: Prepare LLVM (Linux)
        if: inputs.build-os == 'linux'
        shell: bash
        run: |
          curl -LSso LLVM-22.1.0-Linux-X64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz
          mkdir -p ${{github.workspace}}/.temp/tools/llvm/
          tar --strip-components=1 --directory=${{github.workspace}}/.temp/tools/llvm/ --auto-compress --extract --file=${{github.workspace}}/LLVM-22.1.0-Linux-X64.tar.xz
          rm -f ${{github.workspace}}/LLVM-22.1.0-Linux-X64.tar.xz
      - id: prepare-llvm-osx
        name: Prepare LLVM (macOS)
        if: inputs.build-os == 'osx'
        shell: bash
        run: |
          curl -LSso LLVM-22.1.0-macOS-ARM64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-macOS-ARM64.tar.xz
          mkdir -p ${{github.workspace}}/.temp/tools/llvm/
          tar --strip-components=1 --directory=${{github.workspace}}/.temp/tools/llvm/ --auto-compress --extract --file=${{github.workspace}}/LLVM-22.1.0-macOS-ARM64.tar.xz
          rm -f ${{github.workspace}}/LLVM-22.1.0-macOS-ARM64.tar.xz
      - id: prepare-llvm-windows
        name: Prepare LLVM (Windows)
        if: inputs.build-os == 'windows'
        run: |
          Invoke-WebRequest -OutFile "${{github.workspace}}/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz" -Uri https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz
          New-Item -Type Directory -Path "${{github.workspace}}/.temp/tools/llvm/"
          C:/Windows/System32/tar.exe --strip-components=1 --directory="${{github.workspace}}/.temp/tools/llvm/" --auto-compress --extract --file="${{github.workspace}}/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz"
          Remove-Item -Force -Path "${{github.workspace}}/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz"
      - id: prepare-cmake-linux
        name: Prepare CMake (Linux)
        if: inputs.build-os == 'linux'
        shell: bash
        run: |
          curl -LSso ${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-x86_64.tar.gz
          mkdir -p ${{github.workspace}}/.temp/tools/cmake/
          tar --strip-components=1 --directory=${{github.workspace}}/.temp/tools/cmake/ --auto-compress --extract --file=${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz
          rm -f ${{github.workspace}}/cmake-4.4.0-linux-x86_64.tar.gz
      - id: prepare-cmake-osx
        name: Prepare CMake (macOS)
        if: inputs.build-os == 'osx'
        shell: bash
        run: |
          curl -LSso ${{github.workspace}}/cmake-4.4.0-macos10.10-universal.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-macos10.10-universal.tar.gz
          mkdir -p ${{github.workspace}}/.temp/tools/cmake/
          tar --strip-components=3 --directory=${{github.workspace}}/.temp/tools/cmake/ --auto-compress --extract --file=${{github.workspace}}/cmake-4.4.0-macos10.10-universal.tar.gz
          rm -f ${{github.workspace}}/cmake-4.4.0-macos10.10-universal.tar.gz
      - id: prepare-cmake-windows
        name: Prepare CMake (Windows)
        if: inputs.build-os == 'windows'
        run: |
          Invoke-WebRequest -OutFile "${{github.workspace}}/cmake-4.4.0-windows-x86_64.zip" -Uri https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-windows-x86_64.zip
          New-Item -Type Directory -Path "${{github.workspace}}/.temp/tools/cmake/"
          C:/Windows/System32/tar.exe --strip-components=1 --directory="${{github.workspace}}/.temp/tools/cmake/" --auto-compress --extract --file="${{github.workspace}}/cmake-4.4.0-windows-x86_64.zip"
          Remove-Item -Force -Path "${{github.workspace}}/cmake-4.4.0-windows-x86_64.zip"
      - id: run-cmake
        name: Run CMake
        env:
          CMAKE_C_COMPILER: ${{github.workspace}}/.temp/tools/llvm/bin/clang
          CMAKE_CXX_COMPILER: ${{github.workspace}}/.temp/tools/llvm/bin/clang++
        run: |
          ${{github.workspace}}/.temp/tools/cmake/bin/cmake --workflow --preset ${{needs.map-build-config.outputs.mapped-build-config}}-ninja-clang
      - id: upload-artifacts
        name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/${{needs.map-build-config.outputs.mapped-build-config}}-ninja-clang/dist/glekcraft-*.zip
          archive: false
          if-no-files-found: error
